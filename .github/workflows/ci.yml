name: CI

on:
  pull_request_target:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  run-ci:
    runs-on: ubuntu-latest
    steps:
      # Checkout Action: https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Adding repository parameter to ensure that this action runs properly on the forks!
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Setup Node Action: https://github.com/actions/setup-node
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 16.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier
        run: npm run prettier

      # Auto Commit Action Repo: https://github.com/stefanzweifel/git-auto-commit-action
      - name: Commit and push formatting changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-format code with prettier"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Run ESLint
        run: npm run lint
